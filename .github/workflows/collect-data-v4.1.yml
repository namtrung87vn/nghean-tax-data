name: Cập nhật dữ liệu Thuế Nghệ An V4.1 (LEGACY)

# V4.1 được giữ lại chỉ để xem lịch sử.
# Không còn schedule/push để tránh chạy song song và xung đột dữ liệu với V4.2.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy:
    name: V4.1 đã ngừng chạy tự động
    runs-on: ubuntu-latest

    steps:
      - name: Thông báo
        run: |
          echo "Workflow V4.1 đã được ngừng để tránh chạy trùng với V4.2."
          echo "Hãy dùng workflow: Cập nhật dữ liệu Thuế Nghệ An V4.2."
