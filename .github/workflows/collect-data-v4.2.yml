name: Cập nhật dữ liệu Thuế Nghệ An V4.2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Loại dữ liệu cần cập nhật"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - news

  schedule:
    - cron: "7,37 * * * *"
    - cron: "19 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nghean-tax-data-update
  cancel-in-progress: false

jobs:
  update-data:
    name: Thu thập và lưu dữ liệu
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Đồng bộ nhánh main mới nhất
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Xác định chế độ cập nhật
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "19 */6 * * *" ]]; then
            MODE="full"
          else
            MODE="news"
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "Chế độ cập nhật: $MODE"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài thư viện dự án
        run: npm ci --include=dev

      # Thử nguồn chính trước. Hiện nghean.gdt.gov.vn thường timeout từ GitHub runner,
      # nên không dùng Chromium để tránh chờ rất lâu.
      - name: Cập nhật tin tức từ nguồn Thuế
        if: env.MODE == 'news'
        run: npm run collect:news
        env:
          BROWSER_ENABLED: "false"
          CACHE_IMAGES: "false"
          REQUEST_TIMEOUT_MS: "8000"
          REQUEST_RETRIES: "0"
          MAX_NEWS_PAGES: "10"
          READER_ENABLED: "true"
          READER_TIMEOUT_MS: "75000"
          READER_DELAY_MS: "2500"
          MAX_READER_NEWS_PAGES: "15"

      - name: Cập nhật toàn bộ dữ liệu từ nguồn Thuế
        if: env.MODE == 'full'
        run: npm run collect:full
        env:
          BROWSER_ENABLED: "false"
          CACHE_IMAGES: "false"
          REQUEST_TIMEOUT_MS: "8000"
          REQUEST_RETRIES: "0"
          MAX_NEWS_PAGES: "10"
          MAX_DOC_PAGES: "40"
          READER_ENABLED: "true"
          READER_TIMEOUT_MS: "75000"
          READER_DELAY_MS: "2500"
          MAX_READER_NEWS_PAGES: "15"
          MAX_READER_DOC_PAGES: "40"

      # Nếu 3 bộ tin vẫn stale/seed/thiếu dữ liệu thì lấy tin mới từ RSS tìm kiếm.
      # Bước này chỉ thay bộ tin bị lỗi; bộ nào nguồn chính lấy tốt thì giữ nguyên.
      - name: Dự phòng RSS cho tin tức
        run: node src/refresh-news-rss.mjs

      - name: Kiểm tra JSON
        run: npm run validate

      - name: Xác nhận dữ liệu live đạt yêu cầu
        run: npm run assert:refresh

      - name: Ghi báo cáo vào Summary
        if: always()
        shell: bash
        run: npm run report >> "$GITHUB_STEP_SUMMARY"

      - name: Lưu dữ liệu vào repository
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "nghean-tax-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
            exit 0
          fi

          git commit -m "data: cập nhật dữ liệu ($MODE)"

          for attempt in 1 2 3; do
            echo "Lần push $attempt/3"
            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              git status --short || true
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Đã push dữ liệu thành công."
              exit 0
            fi

            sleep $((attempt * 3))
          done

          echo "Không push được sau 3 lần thử."
          exit 1
