name: Cập nhật dữ liệu Thuế Nghệ An V4.2 - Windows Local

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Loại dữ liệu cần cập nhật"
        required: true
        default: "news"
        type: choice
        options:
          - news
          - full

  schedule:
    # GitHub Actions dùng UTC.
    # Tin tức: phút 07 và 37 mỗi giờ.
    - cron: "7,37 * * * *"
    # Toàn bộ dữ liệu: phút 19 mỗi 6 giờ.
    - cron: "19 */6 * * *"

permissions:
  contents: write

concurrency:
  group: nghean-tax-data-update
  cancel-in-progress: false

jobs:
  update-data:
    name: Thu thập trên máy Windows tại Việt Nam
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Đồng bộ main mới nhất
        shell: powershell
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Xác định chế độ cập nhật
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $mode = "${{ inputs.mode }}"
          }
          elseif ("${{ github.event_name }}" -eq "schedule" -and "${{ github.event.schedule }}" -eq "19 */6 * * *") {
            $mode = "full"
          }
          else {
            $mode = "news"
          }

          "MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Chế độ cập nhật: $mode"

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cài thư viện dự án
        shell: powershell
        run: npm ci --include=dev

      - name: Tìm Chrome trên máy Windows
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $candidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if ($chrome) {
            Write-Host "Dùng Chrome: $chrome"
            "PLAYWRIGHT_EXECUTABLE_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            Write-Host "Không tìm thấy Chrome hệ thống. Cài Chromium của Playwright..."
            npx playwright install chromium
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Kiểm tra Playwright
        shell: powershell
        run: |
          npx playwright --version
          node -e "import('playwright').then(async ({chromium})=>{const p=process.env.PLAYWRIGHT_EXECUTABLE_PATH; const b=await chromium.launch({headless:true,...(p?{executablePath:p}:{})}); console.log('Chromium/Chrome launch: OK'); await b.close();}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Cập nhật tin tức chính thức
        if: env.MODE == 'news'
        shell: powershell
        env:
          BROWSER_ENABLED: "true"
          BROWSER_TIMEOUT_MS: "90000"
          BROWSER_SETTLE_MS: "2500"
          BROWSER_RETRY_DELAY_MS: "1500"
          MAX_BROWSER_NEWS_PAGES: "20"

          # Không dùng RSS/Google/Bing/Reader cho mục Tin tức.
          READER_ENABLED: "false"

          # Direct fetch chỉ là dự phòng; nguồn chính là Chrome/Playwright.
          REQUEST_TIMEOUT_MS: "15000"
          REQUEST_RETRIES: "0"
          MAX_NEWS_PAGES: "10"

          # Bật cache ảnh; nếu nguồn không trả thumbnail hợp lệ thì Mini App dùng icon mặc định.
          CACHE_IMAGES: "true"
          MAX_CACHED_IMAGES: "120"
        run: |
          npm run collect:news
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node src/finalize-official-news.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          npm run build:static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cập nhật toàn bộ dữ liệu chính thức
        if: env.MODE == 'full'
        shell: powershell
        env:
          BROWSER_ENABLED: "true"
          BROWSER_TIMEOUT_MS: "90000"
          BROWSER_SETTLE_MS: "2500"
          BROWSER_RETRY_DELAY_MS: "1500"
          MAX_BROWSER_NEWS_PAGES: "20"
          MAX_BROWSER_DOC_PAGES: "80"

          READER_ENABLED: "false"

          REQUEST_TIMEOUT_MS: "15000"
          REQUEST_RETRIES: "0"
          MAX_NEWS_PAGES: "10"
          MAX_DOC_PAGES: "65"

          CACHE_IMAGES: "true"
          MAX_CACHED_IMAGES: "120"
        run: |
          npm run collect:full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          node src/finalize-official-news.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          npm run build:static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Kiểm tra JSON
        shell: powershell
        run: npm run validate

      - name: Xác nhận dữ liệu live chính thức
        shell: powershell
        run: npm run assert:refresh

      - name: Ghi báo cáo vào Summary
        if: always()
        shell: powershell
        run: npm run report | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Lưu dữ liệu vào repository
        if: success()
        shell: powershell
        run: |
          git config user.name "nghean-tax-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add docs

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Không có thay đổi dữ liệu."
            exit 0
          }

          git commit -m "data: cập nhật dữ liệu chính thức ($env:MODE)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Lần push $attempt/3"
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            git rebase -X theirs origin/main
            if ($LASTEXITCODE -ne 0) {
              git status --short
              git rebase --abort
              exit 1
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Đã push dữ liệu thành công."
              exit 0
            }

            Start-Sleep -Seconds ($attempt * 3)
          }

          Write-Error "Không push được sau 3 lần thử."
          exit 1
